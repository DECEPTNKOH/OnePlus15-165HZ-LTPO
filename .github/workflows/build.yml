name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run checks
        run: bash tests/run.sh

      - name: Read version from module.prop
        id: meta
        run: |
          echo "version=$(grep -m1 '^version=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -m1 '^versionCode=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "id=$(grep -m1 '^id=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          cd module
          zip -r "../${{ steps.meta.outputs.id }}.zip" . -x '.*' -x '*/.*'
          cd ..
          unzip -l "${{ steps.meta.outputs.id }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.id }}-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: ${{ steps.meta.outputs.id }}.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.id }}.zip
          body_path: CHANGELOG.md
          generate_release_notes: true
