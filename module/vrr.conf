# Настройки OnePlus15-165HZ-LTPO.
# Файл читается и post-fs-data.sh (при загрузке), и демоном (при старте).
# После правки: перезагрузка, либо `su -c "killall -q vrrd.sh; /data/adb/modules/OnePlus15-165HZ-LTPO/service.sh"`.

# --- патч refresh_rate_config.xml ---------------------------------------
# 1 = во всех приложениях в активном состоянии 165 Гц (как в исходном модуле).
# 0 = уважать стоковые ограничения: приложения, которым OPlus прописал 60 или 90,
#     останутся на 60/90, а 144-герцовые — на 144.
FORCE_ALL=1

# --- демон --------------------------------------------------------------
# 0 = патч конфига есть, но переключением никто не занимается: 165 Гц постоянно,
#     как в исходном модуле (в простое частота не падает).
DAEMON=1

# Значения настройки Settings.Secure/oplus_customize_screen_refresh_rate.
# ACTIVE_MODE берёт 4-й слот rateId (после патча = 7 = 165 Гц),
# IDLE_MODE  берёт 2-й слот (после патча = стоковое поведение режима «120 Гц»,
#            то есть ADFR-режим панели, который умеет опускаться до 1 Гц).
# Менять есть смысл только при отладке.
ACTIVE_MODE=7
IDLE_MODE=1

# Сколько секунд без касаний экрана считать простоем.
# Меньше — быстрее уходит в LTPO, но чаще дёргается переключение режима.
IDLE_TIMEOUT=2

# Пауза после касания, прежде чем снова ждать событие (сек, допускается дробное).
# Защищает от сотен перезапусков getevent во время свайпа.
DEBOUNCE=0.5

# Приложения, в которых НЕ уходить в простой (остаётся 165 Гц, пока они на экране).
# Нужно для игр, которые рисуют без касаний. Пусто = правило выключено.
# Проверка выполняется один раз в момент ухода в простой, не в цикле.
# Пример: KEEP_ACTIVE_PKGS="com.miHoYo.Yuanshen com.activision.callofduty.shooter"
KEEP_ACTIVE_PKGS=""

# Кому запрещать ронять частоту через запрос окна
# (`preferredMaxDisplayRefreshRate` / `preferredDisplayModeId`):
#   camera — только приложениям с доступом к камере (по умолчанию, без побочек);
#   all    — всем записям. 165 Гц железно везде, но ни одно приложение
#            не сможет попросить свою частоту: плееру под 24-кадровое кино
#            не дадут уйти на 60;
#   off    — не трогать вовсе.
WIN_OVERRIDE=camera

# --- камера --------------------------------------------------------------
# 1 = снять зажим частоты в приложении камеры.
# OPlus при открытой камере отдаёт окну rateId 2 (60 Гц), а в режиме высокой
# яркости — rateId 1 (90 Гц). Тег <cameraOverride package="X"/> выводит пакет
# из-под этого правила, а highLightCameraRate="7" поднимает второй кламп до 165.
CAMERA_165=1

# Дополнительные пакеты сверх автоматически найденных, через пробел.
# Список приложений с разрешением на камеру собирается сам (camera_pkgs.auto)
# после каждой загрузки и по кнопке «Действие» в менеджере KernelSU.
CAMERA_PKGS="com.oplus.camera"

# 1 = не уходить в простой, пока открыто приложение с камерой.
# В видоискателе по экрану не возят, и без этого потолок через IDLE_TIMEOUT
# опустился бы до 120 Гц.
KEEP_ACTIVE_CAMERA=1

# 1 = писать лог в $MODDIR/vrrd.log
DEBUG=1
