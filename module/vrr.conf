# OnePlus15-165HZ-LTPO settings.
# Read by post-fs-data.sh (at boot) and by the daemon (at start).
# After editing: reboot, or run
# `su -c "killall -q vrrd.sh; /data/adb/modules/OnePlus15-165HZ-LTPO/service.sh"`.

# --- refresh_rate_config.xml patch ---------------------------------------
# 1 = 165 Hz in every app while active (what the original module did).
# 0 = respect the stock limits: apps OPlus pinned to 60 or 90 Hz stay there,
#     and the 144 Hz ones stay at 144.
FORCE_ALL=1

# --- daemon ---------------------------------------------------------------
# 0 = the config is still patched, but nothing switches: 165 Hz stays pinned,
#     like the original module, and the rate never drops while idle.
DAEMON=1

# Values written to Settings.Secure/oplus_customize_screen_refresh_rate.
# ACTIVE_MODE picks the 4th rateId slot (7 = 165 Hz after the patch),
# IDLE_MODE picks the 2nd slot (the stock "120 Hz" behaviour after the patch,
#           i.e. the ADFR-capable panel mode that can go down to 1 Hz).
# Only worth touching while debugging.
ACTIVE_MODE=7
IDLE_MODE=1

# Seconds without a touch before the screen counts as idle.
# Lower means LTPO kicks in sooner, but the mode switches more often.
IDLE_TIMEOUT=2

# Pause after a touch before waiting for the next event (seconds, decimals ok).
# Keeps a swipe from restarting getevent hundreds of times.
DEBOUNCE=0.5

# Apps that must NOT trigger the idle state — 165 Hz is kept while they are in
# the foreground. Meant for games that render without touches. Empty = disabled.
# The check runs once, at the moment of going idle, not in a loop.
# Example: KEEP_ACTIVE_PKGS="com.miHoYo.Yuanshen com.activision.callofduty.shooter"
KEEP_ACTIVE_PKGS=""

# Who is forbidden to pull the rate down through the window request
# (`preferredMaxDisplayRefreshRate` / `preferredDisplayModeId`):
#   camera — only apps holding the camera permission (default, no side effects);
#   all    — every entry. 165 Hz everywhere, but no app can request its own
#            rate any more: a player will not get 60 Hz for 24 fps video;
#   off    — do not touch this at all.
WIN_OVERRIDE=camera

# --- camera ---------------------------------------------------------------
# 1 = lift the refresh rate caps in camera apps.
# With a camera open OPlus hands the window rateId 2 (60 Hz), and rateId 1
# (90 Hz) at high brightness. A <cameraOverride package="X"/> tag exempts the
# package from the first rule, highLightCameraRate="7" lifts the second one.
CAMERA_165=1

# Extra packages on top of the ones discovered automatically, space separated.
# The list of apps holding the camera permission is collected by the module
# after every boot and by the action button in the KernelSU manager, and is
# stored in /data/adb/vrr_camera_pkgs so it survives a module update.
CAMERA_PKGS="com.oplus.camera"

# 1 = do not go idle while a camera app is in the foreground.
# Nobody swipes the screen in a viewfinder, so without this the panel would be
# capped at 120 Hz after IDLE_TIMEOUT.
KEEP_ACTIVE_CAMERA=1

# 1 = write to $MODDIR/vrrd.log
DEBUG=1
